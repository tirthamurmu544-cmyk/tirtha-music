<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIRTHA MUSIC | Advanced Audio Player</title>
<!-- আইডি৩ ট্যাগ এবং এমপি৩ এনকোডার সিডিএন -->
<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<!-- গুগল ফন্ট -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #8b5cf6;
    --secondary: #22d3ee;
    --accent: #f472b6;
    --bg-dark: #0a0a14;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(34, 211, 238, 0.15), transparent 25%);
    background-attachment: fixed;
    padding: 20px;
    display: flex;
    justify-content: center;
  }

  .app-container {
    width: 100%;
    max-width: 1200px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* হেডার */
  header {
    text-align: center;
    padding: 20px 0;
  }
  h1 {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* গ্লাস প্যানেল ডিজাইন */
  .glass-panel {
    background: var(--glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  /* ফাইল ইনপুট */
  .file-upload-wrapper {
    display: flex;
    align-items: center;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .custom-file-btn {
    background: linear-gradient(135deg, var(--primary), #6d28d9);
    color: white;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .custom-file-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
  }
  .custom-file-btn input[type="file"] { display: none; }
  #fileName { color: var(--text-muted); font-size: 14px; }

  /* মেইন গ্রিড (প্লেয়ার + কন্ট্রোল) */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 900px) {
    .main-grid { grid-template-columns: 350px 1fr; }
  }

  /* প্লেয়ার কার্ড */
  .player-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .album-art {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 16px;
    background: #1e1e2d;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    margin-bottom: 20px;
    position: relative;
  }
  .album-art img { width: 100%; height: 100%; object-fit: cover; }
  
  .track-info h2 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 300px;
  }
  .track-info .artist { color: var(--secondary); font-size: 14px; margin-bottom: 15px; }
  .meta-tags { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
  .meta-tag { background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 6px; }

  /* ট্রান্সপোর্ট কন্ট্রোল */
  .controls { width: 100%; }
  .progress-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
    font-size: 12px;
    color: var(--text-muted);
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 5px;
    background: rgba(255,255,255,0.1);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--secondary);
    cursor: pointer;
    box-shadow: 0 0 10px var(--secondary);
  }
  .buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
  }
  .btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    color: white;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    transition: 0.2s;
  }
  .btn.play-btn {
    width: 70px;
    height: 70px;
    font-size: 24px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border: none;
    box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
  }
  .btn:hover { transform: scale(1.05); }

  /* ভিজুয়ালাইজার */
  #visualizer {
    width: 100%;
    height: 60px;
    margin-top: 20px;
    border-radius: 10px;
    background: rgba(0,0,0,0.2);
  }

  /* ইফেক্ট প্যানেল */
  .effects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
  }
  .effect-group h3 {
    font-size: 14px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 15px;
    border-bottom: 1px solid var(--glass-border);
    padding-bottom: 8px;
  }
  .slider-group { margin-bottom: 15px; }
  .slider-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
    color: #cbd5e1;
  }
  .slider-header span { color: var(--secondary); font-weight: 600; }

  /* টগল সুইচ */
  .toggle-wrapper { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
  .toggle-label { font-size: 14px; font-weight: 600; color: var(--primary); }
  .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-switch {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 34px;
  }
  .slider-switch:before {
    position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
    background-color: white; transition: .4s; border-radius: 50%;
  }
  .switch input:checked + .slider-switch { background-color: var(--primary); }
  .switch input:checked + .slider-switch:before { transform: translateX(22px); }

  /* ডাউনলোড সেকশন */
  .download-section { text-align: center; }
  .download-section h3 { margin-bottom: 15px; color: var(--text-main); }
  .download-btns { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
  .dl-btn {
    padding: 12px 30px; border-radius: 10px; border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.05); color: white; font-weight: 600; cursor: pointer; transition: 0.2s;
  }
  .dl-btn:hover { background: var(--primary); border-color: var(--primary); }
  .dl-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #statusMsg { margin-top: 15px; font-size: 14px; color: var(--secondary); min-height: 20px; }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>TIRTHA MUSIC</h1>
    <div class="subtitle">Advanced Web Audio Player</div>
  </header>

  <!-- ফাইল আপলোড -->
  <div class="glass-panel" style="text-align: center; padding: 15px;">
    <div class="file-upload-wrapper">
      <label class="custom-file-btn">
        🎵 সিলেক্ট অডিও ফাইল
        <input type="file" id="fileInput" accept="audio/*">
      </label>
      <span id="fileName">কোনো ফাইল সিলেক্ট করা হয়নি</span>
    </div>
  </div>

  <!-- মেইন সেকশন -->
  <div class="main-grid">
    <!-- প্লেয়ার -->
    <div class="glass-panel player-card">
      <div class="album-art">
        <img id="coverArt" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='300' height='300' fill='%231e1e2d'/><text x='150' y='165' font-size='80' text-anchor='middle' fill='%238b5cf6'>♪</text></svg>" alt="Cover">
      </div>
      <div class="track-info">
        <h2 id="title">শিরোনাম নেই</h2>
        <div class="artist" id="artist">শিল্পী নেই</div>
        <div class="meta-tags">
          <div class="meta-tag" id="album">অ্যালবাম: -</div>
          <div class="meta-tag" id="year">সাল: -</div>
          <div class="meta-tag" id="bitrate">বিটরেট: -</div>
        </div>
      </div>

      <div class="controls">
        <div class="progress-container">
          <span id="currTime">0:00</span>
          <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1">
          <span id="totalTime">0:00</span>
        </div>
        <div class="buttons">
          <button class="btn" id="playBtn">▶</button>
          <button class="btn" id="stopBtn" style="width: 40px; height: 40px; font-size: 14px;">■</button>
        </div>
      </div>
      <canvas id="visualizer"></canvas>
    </div>

    <!-- ইফেক্ট কন্ট্রোল -->
    <div class="glass-panel">
      <div class="effects-grid">
        
        <!-- EQ -->
        <div class="effect-group">
          <h3>🎚️ Equalizer</h3>
          <div class="slider-group">
            <div class="slider-header"><label>Bass</label><span id="bassVal">0 dB</span></div>
            <input type="range" id="bass" min="-20" max="20" step="0.5" value="0">
          </div>
          <div class="slider-group">
            <div class="slider-header"><label>Mid</label><span id="midVal">0 dB</span></div>
            <input type="range" id="mid" min="-20" max="20" step="0.5" value="0">
          </div>
          <div class="slider-group">
            <div class="slider-header"><label>Treble</label><span id="trebleVal">0 dB</span></div>
            <input type="range" id="treble" min="-20" max="20" step="0.5" value="0">
          </div>
        </div>

        <!-- FX -->
        <div class="effect-group">
          <h3>🌀 Effects</h3>
          <div class="slider-group">
            <div class="slider-header"><label>Subwoofer</label><span id="subVal">0%</span></div>
            <input type="range" id="sub" min="0" max="2" step="0.05" value="0">
          </div>
          <div class="slider-group">
            <div class="slider-header"><label>Hall Reverb</label><span id="hallVal">0%</span></div>
            <input type="range" id="hall" min="0" max="1" step="0.05" value="0">
          </div>
          <div class="slider-group">
            <div class="slider-header"><label>Echo</label><span id="echoVal">0%</span></div>
            <input type="range" id="echo" min="0" max="1" step="0.05" value="0">
          </div>
          <div class="slider-group">
            <div class="slider-header"><label>Surround</label><span id="surroundVal">1x</span></div>
            <input type="range" id="surround" min="0" max="3" step="0.1" value="1">
          </div>
        </div>

        <!-- 3D Audio -->
        <div class="effect-group">
          <h3>🎧 3D Audio</h3>
          <div class="toggle-wrapper">
            <span class="toggle-label">3D চালু করুন</span>
            <label class="switch">
              <input type="checkbox" id="enable3d">
              <span class="slider-switch"></span>
            </label>
          </div>
          <div class="slider-group">
            <div class="slider-header"><label>Rotation Speed</label><span id="speedVal">0.25 Hz</span></div>
            <input type="range" id="speed" min="0.05" max="2" step="0.05" value="0.25">
          </div>
          <div class="slider-group">
            <div class="slider-header"><label>Intensity (Depth)</label><span id="depthVal">3 m</span></div>
            <input type="range" id="depth" min="1" max="10" step="0.5" value="3">
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ডাউনলোড সেকশন -->
  <div class="glass-panel download-section">
    <h3>⬇️ ডাউনলোড (প্রসেসড অডিও)</h3>
    <div class="download-btns">
      <button class="dl-btn" data-fmt="wav">Save as WAV</button>
      <button class="dl-btn" data-fmt="mp3">Save as MP3</button>
      <button class="dl-btn" data-fmt="flac">Save as FLAC</button>
    </div>
    <div id="statusMsg"></div>
  </div>
</div>

<script>
// গ্লোবাল ভেরিয়েবল
let audioCtx = null;
let graph = null;
let audioBuffer = null;
let sourceNode = null;
let isPlaying = false;
let playStart = 0;
let playOffset = 0;
let rafId = null;
let currentFile = null;

// DOM এলিমেন্ট
const el = id => document.getElementById(id);

// অডিও গ্রাফ তৈরি
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  graph = buildGraph(audioCtx);
  updateEffects(false);
  graph.oscillators.forEach(o => { try { o.start(0); } catch(e) {} });
  startVisualizer();
}

function buildGraph(ctx) {
  const g = { ctx };
  
  // ইনপুট ও ইকুয়ালাইজার
  g.input = ctx.createGain();
  g.bass = ctx.createBiquadFilter(); g.bass.type = 'lowshelf'; g.bass.frequency.value = 150;
  g.mid = ctx.createBiquadFilter(); g.mid.type = 'peaking'; g.mid.frequency.value = 1000; g.mid.Q.value = 0.8;
  g.treble = ctx.createBiquadFilter(); g.treble.type = 'highshelf'; g.treble.frequency.value = 4000;
  g.preGain = ctx.createGain();
  
  g.input.connect(g.bass); g.bass.connect(g.mid); g.mid.connect(g.treble); g.treble.connect(g.preGain);

  // সাবউফার
  g.subFilter = ctx.createBiquadFilter(); g.subFilter.type = 'lowpass'; g.subFilter.frequency.value = 120;
  g.subGain = ctx.createGain(); g.subGain.gain.value = 0;
  g.preGain.connect(g.subFilter); g.subFilter.connect(g.subGain);

  // সামিং বাস
  g.sum = ctx.createGain();
  g.preGain.connect(g.sum); g.subGain.connect(g.sum);

  // রিভার্ব (Hall)
  const impulse = ctx.createBuffer(2, ctx.sampleRate * 2, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = impulse.getChannelData(c);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);
  }
  g.reverb = ctx.createConvolver(); g.reverb.buffer = impulse;
  g.reverbGain = ctx.createGain(); g.reverbGain.gain.value = 0;
  g.preGain.connect(g.reverb); g.reverb.connect(g.reverbGain); g.reverbGain.connect(g.sum);

  // ইকো
  g.delay = ctx.createDelay(2.0); g.delay.delayTime.value = 0.3;
  g.feedback = ctx.createGain(); g.feedback.gain.value = 0.35;
  g.echoGain = ctx.createGain(); g.echoGain.gain.value = 0;
  g.preGain.connect(g.delay); g.delay.connect(g.feedback); g.feedback.connect(g.delay);
  g.delay.connect(g.echoGain); g.echoGain.connect(g.sum);

  // 3D প্যানার
  g.panner = ctx.createPanner();
  g.panner.panningModel = 'HRTF'; g.panner.distanceModel = 'inverse';
  if (g.panner.positionX) { g.panner.positionX.value = 0; g.panner.positionY.value = 0; g.panner.positionZ.value = 0; }
  g.oscX = ctx.createOscillator(); g.oscX.type = 'sine'; g.oscX.frequency.value = 0.25;
  g.oscZ = ctx.createOscillator(); g.oscZ.type = 'sine'; g.oscZ.frequency.value = 0.25;
  g.depthX = ctx.createGain(); g.depthX.gain.value = 0;
  g.depthZ = ctx.createGain(); g.depthZ.gain.value = 0;
  if (g.panner.positionX) {
    g.oscX.connect(g.depthX); g.depthX.connect(g.panner.positionX);
    g.oscZ.connect(g.depthZ); g.depthZ.connect(g.panner.positionZ);
  }
  g.oscillators = [g.oscX, g.oscZ];
  
  g.pannerGain = ctx.createGain(); g.pannerGain.gain.value = 0;
  g.bypassGain = ctx.createGain(); g.bypassGain.gain.value = 1;
  g.sum.connect(g.panner); g.panner.connect(g.pannerGain); g.sum.connect(g.bypassGain);

  // স্টেরিও ওয়াইডনার
  g.widenerIn = ctx.createGain();
  g.pannerGain.connect(g.widenerIn); g.bypassGain.connect(g.widenerIn);
  g.splitter = ctx.createChannelSplitter(2); g.widenerIn.connect(g.splitter);
  g.midSum = ctx.createGain(); g.sideSum = ctx.createGain();
  const gL1 = ctx.createGain(), gR1 = ctx.createGain(), gL2 = ctx.createGain(), gR2 = ctx.createGain();
  gL1.gain.value = 0.5; gR1.gain.value = 0.5; gL2.gain.value = 0.5; gR2.gain.value = -0.5;
  g.splitter.connect(gL1, 0); gL1.connect(g.midSum); g.splitter.connect(gR1, 1); gR1.connect(g.midSum);
  g.splitter.connect(gL2, 0); gL2.connect(g.sideSum); g.splitter.connect(gR2, 1); gR2.connect(g.sideSum);
  g.outL = ctx.createGain(); g.outR = ctx.createGain();
  g.midSum.connect(g.outL); g.midSum.connect(g.outR);
  g.sideToL = ctx.createGain(); g.sideToR = ctx.createGain();
  g.sideToL.gain.value = 1; g.sideToR.gain.value = -1;
  g.sideSum.connect(g.sideToL); g.sideToL.connect(g.outL);
  g.sideSum.connect(g.sideToR); g.sideToR.connect(g.outR);
  g.merger = ctx.createChannelMerger(2);
  g.outL.connect(g.merger, 0, 0); g.outR.connect(g.merger, 0, 1);

  // মাস্টার আউট
  g.master = ctx.createGain();
  g.analyser = ctx.createAnalyser(); g.analyser.fftSize = 256;
  g.merger.connect(g.master); g.master.connect(g.analyser); g.analyser.connect(ctx.destination);

  return g;
}

// ইফেক্ট আপডেট
function updateEffects(smooth = true) {
  if (!graph) return;
  const set = (param, val) => {
    if (smooth) { try { param.setTargetAtTime(val, audioCtx.currentTime, 0.02); } catch(e) { param.value = val; } }
    else param.value = val;
  };

  set(graph.bass.gain, parseFloat(el('bass').value));
  set(graph.mid.gain, parseFloat(el('mid').value));
  set(graph.treble.gain, parseFloat(el('treble').value));
  set(graph.subGain.gain, parseFloat(el('sub').value));
  set(graph.reverbGain.gain, parseFloat(el('hall').value));
  set(graph.echoGain.gain, parseFloat(el('echo').value));
  set(graph.sideToL.gain, parseFloat(el('surround').value));
  set(graph.sideToR.gain, -parseFloat(el('surround').value));
  set(graph.oscX.frequency, parseFloat(el('speed').value));
  set(graph.oscZ.frequency, parseFloat(el('speed').value));
  set(graph.depthX.gain, parseFloat(el('depth').value));
  set(graph.depthZ.gain, parseFloat(el('depth').value));

  const is3D = el('enable3d').checked;
  if (is3D) {
    if (graph.bypassGain.gain.value === 1) {
      try { graph.sum.disconnect(graph.bypassGain); graph.sum.connect(graph.panner); } catch(e) {}
      graph.pannerGain.gain.value = 1; graph.bypassGain.gain.value = 0;
    }
  } else {
    if (graph.bypassGain.gain.value === 0) {
      try { graph.sum.disconnect(graph.panner); graph.sum.connect(graph.bypassGain); } catch(e) {}
      graph.pannerGain.gain.value = 0; graph.bypassGain.gain.value = 1;
    }
  }
}

// স্লাইডার ইভেন্ট
document.querySelectorAll('input[type="range"]').forEach(slider => {
  slider.addEventListener('input', (e) => {
    const id = e.target.id;
    const val = e.target.value;
    if (id === 'seekBar') return;
    const unit = e.target.nextElementSibling ? e.target.previousElementSibling.querySelector('span').innerText.replace(/[0-9.-]/g, '').trim() : '';
    el(id + 'Val').innerText = val + ' ' + unit;
    updateEffects(true);
  });
});
el('enable3d').addEventListener('change', () => updateEffects(true));

// ফাইল লোড
el('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  currentFile = file;
  el('fileName').innerText = file.name;
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const reader = new FileReader();
  reader.onload = (ev) => {
    audioCtx.decodeAudioData(ev.target.result, (buf) => {
      audioBuffer = buf;
      el('totalTime').innerText = formatTime(buf.duration);
      
      const baseName = file.name.replace(/\.[^.]+$/, '');
      el('title').innerText = baseName;
      el('artist').innerText = 'Unknown Artist';
      el('album').innerText = 'Album: -';
      el('year').innerText = 'Year: -';
      el('bitrate').innerText = 'Bitrate: ' + Math.round((file.size * 8) / buf.duration / 1000) + ' kbps';
      el('coverArt').src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='300' height='300' fill='%231e1e2d'/><text x='150' y='165' font-size='80' text-anchor='middle' fill='%238b5cf6'>♪</text></svg>";

      // ID3 ট্যাগ রিড
      if (typeof jsmediatags !== 'undefined') {
        jsmediatags.read(file, {
          onSuccess: (tag) => {
            const t = tag.tags || {};
            if (t.title) el('title').innerText = t.title;
            if (t.artist) el('artist').innerText = t.artist;
            if (t.album) el('album').innerText = 'Album: ' + t.album;
            if (t.year) el('year').innerText = 'Year: ' + t.year;
            if (t.picture) {
              const bytes = new Uint8Array(t.picture.data);
              const blob = new Blob([bytes], { type: t.picture.format });
              el('coverArt').src = URL.createObjectURL(blob);
            }
          }, onError: () => {}
        });
      }
      playOffset = 0; updateTimeUI();
    }, () => alert('ফাইল ডিকোড করা যায়নি।'));
  };
  reader.readAsArrayBuffer(file);
});

// প্লেব্যাক কন্ট্রোল
function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function updateTimeUI() {
  const cur = isPlaying ? audioCtx.currentTime - playStart : playOffset;
  el('currTime').innerText = formatTime(cur);
  if (audioBuffer) el('seekBar').value = (cur / audioBuffer.duration) * 100;
}

function play() {
  if (!audioBuffer || isPlaying) return;
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (playOffset >= audioBuffer.duration - 0.02) playOffset = 0;

  sourceNode = audioCtx.createBufferSource();
  sourceNode.buffer = audioBuffer;
  sourceNode.connect(graph.input);
  sourceNode.start(0, playOffset);
  playStart = audioCtx.currentTime - playOffset;
  isPlaying = true;
  el('playBtn').innerText = '⏸';
  tick();
}

function pause() {
  if (!isPlaying) return;
  playOffset = audioCtx.currentTime - playStart;
  isPlaying = false;
  if (sourceNode) { sourceNode.stop(); sourceNode.disconnect(); sourceNode = null; }
  cancelAnimationFrame(rafId);
  el('playBtn').innerText = '▶';
}

function stopPlayback() {
  if (sourceNode) { sourceNode.stop(); sourceNode.disconnect(); sourceNode = null; }
  isPlaying = false; playOffset = 0;
  cancelAnimationFrame(rafId);
  el('playBtn').innerText = '▶';
  updateTimeUI();
}

el('playBtn').addEventListener('click', () => { isPlaying ? pause() : play(); });
el('stopBtn').addEventListener('click', stopPlayback);
el('seekBar').addEventListener('input', (e) => {
  if (!audioBuffer) return;
  playOffset = (e.target.value / 100) * audioBuffer.duration;
  if (isPlaying) { pause(); play(); } else updateTimeUI();
});

function tick() {
  cancelAnimationFrame(rafId);
  const loop = () => {
    if (!isPlaying) return;
    updateTimeUI();
    rafId = requestAnimationFrame(loop);
  };
  loop();
}

// ভিজুয়ালাইজার
function startVisualizer() {
  const canvas = el('visualizer');
  const cctx = canvas.getContext('2d');
  canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
  const data = new Uint8Array(graph.analyser.frequencyBinCount);
  setInterval(() => {
    if (!graph) return;
    graph.analyser.getByteFrequencyData(data);
    const W = canvas.width, H = canvas.height;
    cctx.clearRect(0, 0, W, H);
    const bars = 48, bw = W / bars;
    for (let i = 0; i < bars; i++) {
      const v = data[i] / 255, bh = Math.max(2, v * H);
      cctx.fillStyle = '#22d3ee';
      cctx.fillRect(i * bw + 1, H - bh, bw - 2, bh);
    }
  }, 66);
}

// ==========================================
// ডাউনলোড ও এনকোডিং লজিক
// ==========================================
function encodeWAV(buf) {
  const numCh = buf.numberOfChannels, len = buf.length, rate = buf.sampleRate;
  const ba = numCh * 2, ds = len * ba;
  const ab = new ArrayBuffer(44 + ds), view = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); view.setUint32(4, 36 + ds, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, numCh, true);
  view.setUint32(24, rate, true); view.setUint32(28, rate * ba, true); view.setUint16(32, ba, true);
  view.setUint16(34, 16, true); ws(36, 'data'); view.setUint32(40, ds, true);
  const chans = []; for (let c = 0; c < numCh; c++) chans.push(buf.getChannelData(c));
  let off = 44;
  for (let i = 0; i < len; i++) {
    for (let c = 0; c < numCh; c++) {
      let s = chans[c][i]; if (s > 1) s = 1; else if (s < -1) s = -1;
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true); off += 2;
    }
  }
  return new Blob([ab], { type: 'audio/wav' });
}

function encodeMP3(buf) {
  const numCh = Math.min(2, buf.numberOfChannels), rate = buf.sampleRate, len = buf.length;
  const toI16 = f => { const a = new Int16Array(len); for (let i = 0; i < len; i++) { let s = f[i]; if (s > 1) s = 1; else if (s < -1) s = -1; a[i] = s < 0 ? s * 0x8000 : s * 0x7FFF; } return a; };
  const L = toI16(buf.getChannelData(0));
  const R = numCh > 1 ? toI16(buf.getChannelData(1)) : null;
  const enc = new lamejs.Mp3Encoder(numCh, rate, 192);
  const BLOCK = 1152, chunks = [];
  for (let i = 0; i < len; i += BLOCK) {
    const l = L.subarray(i, i + BLOCK);
    const b = numCh > 1 ? enc.encodeBuffer(l, R.subarray(i, i + BLOCK)) : enc.encodeBuffer(l);
    if (b.length > 0) chunks.push(new Int8Array(b));
  }
  const tail = enc.flush(); if (tail.length > 0) chunks.push(new Int8Array(tail));
  return new Blob(chunks, { type: 'audio/mpeg' });
}

// অফলাইন রেন্ডার
async function renderProcessed() {
  const sr = Math.min(44100, audioBuffer.sampleRate);
  const len = Math.ceil(audioBuffer.duration * sr);
  const offCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, len, sr);
  const g = buildGraph(offCtx);
  
  // ইফেক্ট ভ্যালু কপি
  g.bass.gain.value = parseFloat(el('bass').value);
  g.mid.gain.value = parseFloat(el('mid').value);
  g.treble.gain.value = parseFloat(el('treble').value);
  g.subGain.gain.value = parseFloat(el('sub').value);
  g.reverbGain.gain.value = parseFloat(el('hall').value);
  g.echoGain.gain.value = parseFloat(el('echo').value);
  g.sideToL.gain.value = parseFloat(el('surround').value);
  g.sideToR.gain.value = -parseFloat(el('surround').value);

  const src = offCtx.createBufferSource();
  src.buffer = audioBuffer;
  src.connect(g.input);
  src.start(0);
  return await offCtx.startRendering();
}

document.querySelectorAll('.dl-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    if (!audioBuffer) { el('statusMsg').innerText = '⚠️ প্রথমে ফাইল লোড করুন'; return; }
    const fmt = btn.dataset.fmt;
    const btns = document.querySelectorAll('.dl-btn');
    btns.forEach(b => b.disabled = true);
    el('statusMsg').innerText = '⏳ অডিও প্রসেস করা হচ্ছে...';
    
    try {
      const rendered = await renderProcessed();
      el('statusMsg').innerText = '⏳ ফাইল তৈরি হচ্ছে...';
      
      let blob, ext;
      if (fmt === 'wav') { blob = encodeWAV(rendered); ext = 'wav'; }
      else if (fmt === 'mp3') { blob = encodeMP3(rendered); ext = 'mp3'; }
      else { 
        // ওয়েবে FLAC সাপোর্ট না থাকলে WAV ডিফল্ট হবে
        blob = encodeWAV(rendered); ext = 'wav'; 
        el('statusMsg').innerText = '⚠️ ব্রাউজার সীমাবদ্ধতার কারণে FLAC এর বদলে WAV ডাউনলোড হচ্ছে...';
      }

      const base = (currentFile ? currentFile.name.replace(/\.[^.]+$/, '') : 'tirtha') + '-TIRTHA-MUSIC';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = base + '.' + ext;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
      
      el('statusMsg').innerText = '✅ ডাউনলোড সফল হয়েছে!';
    } catch (err) {
      el('statusMsg').innerText = '❌ সমস্যা: ' + err.message;
    } finally {
      btns.forEach(b => b.disabled = false);
    }
  });
});
